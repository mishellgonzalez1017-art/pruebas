<style>
/* Layout: una sola pantalla. Info del negocio a la izquierda, vaso animado a la derecha,
   fresa saludando en la esquina y el menú dentro de una ventana emergente. */
:root {
  --berry: #d6244b;
  --berry-deep: #7a0f2e;
  --blush: #ffe3ea;
  --cream: #fff8f0;
  --leaf: #2f8f4e;
  --sun: #ffc857;
  --ink: #3b0a1a;
  --ink-soft: #7d3a4f;
  --font-display: "Baloo 2", "Trebuchet MS", system-ui, sans-serif;
  --font-body: "Nunito", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--blush);
  background-image:
    radial-gradient(circle at 85% 12%, #ffc4d1 0, transparent 38%),
    radial-gradient(circle at 8% 90%, #ffd9b8 0, transparent 34%);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 16px;
  overflow: hidden;
}
button { font: inherit; color: inherit; cursor: pointer; }
a { color: inherit; }
:focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; }

/* berries falling in the background */
.rain { position: fixed; inset: 0; pointer-events: none; overflow: hidden; }
.rain svg { position: absolute; top: -80px; opacity: .55; animation: drift linear infinite; }
@keyframes drift {
  from { transform: translateY(0) rotate(0deg); }
  to { transform: translateY(calc(100vh + 160px)) rotate(200deg); }
}

.app {
  position: relative;
  height: 100%;
  max-width: 1120px;
  margin: 0 auto;
  display: grid;
  grid-template-columns: 1.05fr .95fr;
  align-items: center;
  gap: 24px;
  padding-block: clamp(12px, 3vh, 36px);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.info { min-width: 0; display: flex; flex-direction: column; gap: 14px; align-items: flex-start; }
.eyebrow {
  margin: 0;
  font-weight: 800;
  font-size: .8rem;
  letter-spacing: .14em;
  text-transform: uppercase;
  color: var(--berry);
  display: flex; align-items: center; gap: 8px;
}
.eyebrow::before { content: ""; width: 28px; height: 3px; border-radius: 2px; background: var(--berry); }
h1 {
  margin: 0;
  font-family: var(--font-display);
  font-weight: 800;
  font-size: clamp(2.6rem, 7vw, 5rem);
  line-height: .95;
  color: var(--berry-deep);
  text-wrap: balance;
}
h1 span { color: var(--berry); display: inline-block; animation: wiggle 3.2s ease-in-out infinite; transform-origin: 50% 90%; }
@keyframes wiggle { 0%, 80%, 100% { transform: rotate(0); } 86% { transform: rotate(-4deg); } 92% { transform: rotate(4deg); } }
.lead { margin: 0; max-width: 34ch; font-size: clamp(1rem, 2vw, 1.2rem); line-height: 1.45; color: var(--ink-soft); }

.facts { list-style: none; margin: 4px 0 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
.facts li { display: flex; align-items: center; gap: 12px; min-width: 0; }
.ico {
  flex: none; width: 38px; height: 38px; border-radius: 12px;
  background: #fff; display: grid; place-items: center; color: var(--berry);
  box-shadow: 0 3px 0 rgba(122, 15, 46, .12);
}
.ico svg { width: 20px; height: 20px; }
.facts small { display: block; font-size: .72rem; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-soft); }
.facts b { font-size: 1.05rem; font-weight: 800; user-select: all; }

.actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 6px; }
.btn {
  border: 0; text-decoration: none; display: inline-flex; align-items: center; gap: 8px;
  padding: 13px 22px; border-radius: 999px; font-weight: 800; font-size: 1rem;
  transition: transform .15s ease, box-shadow .15s ease;
}
.btn:hover { transform: translateY(-2px); }
.btn:active { transform: translateY(1px); }
.btn-main { background: var(--berry); color: #fff; box-shadow: 0 5px 0 var(--berry-deep); animation: pulse 2.4s ease-in-out infinite; }
.btn-main:hover { box-shadow: 0 7px 0 var(--berry-deep); }
.btn-alt { background: #fff; color: var(--berry-deep); box-shadow: 0 5px 0 rgba(122, 15, 46, .18); }
@keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.04); } }

.hero { min-width: 0; min-height: 0; height: 100%; max-height: 640px; display: grid; place-items: center; }
.hero svg { width: 100%; height: 100%; overflow: visible; }
.float { animation: float 3.4s ease-in-out infinite; }
@keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
.twinkle { animation: twinkle 2s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
.twinkle.b { animation-delay: .7s; }
.twinkle.c { animation-delay: 1.3s; }
@keyframes twinkle { 0%, 100% { transform: scale(.4); opacity: .3; } 50% { transform: scale(1); opacity: 1; } }

/* mascot */
.mascot {
  position: fixed; z-index: 5;
  right: max(16px, env(safe-area-inset-right, 0px));
  bottom: calc(10px + env(safe-area-inset-bottom, 0px));
  width: clamp(104px, 15vw, 150px);
  border: 0; background: none; padding: 0;
}
.mascot > svg { display: block; width: 100%; overflow: visible; animation: bob 1.8s ease-in-out infinite; }
@keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-7px); } }
.arm { transform-origin: 112px 98px; animation: wave .55s ease-in-out infinite alternate; }
@keyframes wave { from { transform: rotate(-24deg); } to { transform: rotate(22deg); } }
.eye { transform-box: fill-box; transform-origin: center; animation: blink 4s infinite; }
@keyframes blink { 0%, 92%, 100% { transform: scaleY(1); } 95% { transform: scaleY(.1); } }
.bubble {
  position: absolute; bottom: 100%; right: 14%;
  width: max-content; max-width: min(200px, 60vw);
  margin-bottom: 26px; padding: 12px 16px;
  background: #fff; color: var(--ink);
  border-radius: 22px; font-weight: 800; font-size: .98rem; line-height: 1.25; text-align: left;
  box-shadow: 0 5px 0 rgba(122, 15, 46, .15);
  transform-origin: 90% 100%;
  animation: pop .6s cubic-bezier(.3, 1.6, .5, 1) both, think 3s ease-in-out .6s infinite;
}
.bubble::before, .bubble::after { content: ""; position: absolute; background: #fff; border-radius: 50%; box-shadow: 0 3px 0 rgba(122, 15, 46, .12); }
.bubble::after { width: 14px; height: 14px; right: 26px; bottom: -14px; }
.bubble::before { width: 8px; height: 8px; right: 16px; bottom: -26px; }
@keyframes pop { from { transform: scale(.3); opacity: 0; } to { transform: scale(1); opacity: 1; } }
@keyframes think { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }

/* menu modal */
.overlay {
  position: fixed; inset: 0; z-index: 20;
  display: flex; align-items: center; justify-content: center;
  padding: max(12px, env(safe-area-inset-top, 0px)) max(12px, env(safe-area-inset-right, 0px)) max(12px, env(safe-area-inset-bottom, 0px)) max(12px, env(safe-area-inset-left, 0px));
  background: rgba(59, 10, 26, .55);
  animation: fade .2s ease both;
}
@keyframes fade { from { opacity: 0; } to { opacity: 1; } }
.sheet {
  width: min(980px, 100%); max-height: 100%; height: min(720px, 100%);
  display: flex; flex-direction: column; min-height: 0;
  background: var(--cream); border-radius: 26px; overflow: hidden;
  box-shadow: 0 24px 60px rgba(59, 10, 26, .4);
  animation: rise .35s cubic-bezier(.3, 1.3, .5, 1) both;
}
@keyframes rise { from { transform: translateY(30px) scale(.94); opacity: 0; } to { transform: none; opacity: 1; } }
.sheet-head { display: flex; align-items: center; gap: 12px; padding: 14px 16px 10px 20px; }
.sheet-head h2 { margin: 0; flex: 1; font-family: var(--font-display); font-size: 1.8rem; line-height: 1; color: var(--berry-deep); }
.close { width: 42px; height: 42px; border-radius: 50%; border: 0; background: var(--blush); color: var(--berry-deep); display: grid; place-items: center; }
.close svg { width: 18px; height: 18px; }
.tabs { display: flex; gap: 8px; padding: 0 16px 12px 20px; overflow-x: auto; }
.tab { flex: none; border: 2px solid var(--blush); background: #fff; border-radius: 999px; padding: 6px 14px; font-weight: 800; font-size: .92rem; color: var(--ink-soft); }
.tab[aria-pressed="true"] { background: var(--berry); border-color: var(--berry); color: #fff; }
.grid {
  flex: 1; min-height: 0; overflow-y: auto;
  display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px;
  padding: 4px 16px 16px 20px; align-content: start;
}
.card { min-width: 0; background: #fff; border-radius: 20px; padding: 10px 12px 12px; display: flex; flex-direction: column; gap: 4px; box-shadow: 0 3px 0 rgba(122, 15, 46, .1); animation: cardin .35s ease both; }
@keyframes cardin { from { transform: translateY(10px); opacity: 0; } to { transform: none; opacity: 1; } }
.thumb { background: var(--blush); border-radius: 14px; aspect-ratio: 1; overflow: hidden; transition: transform .2s ease; }
.card:hover .thumb { transform: rotate(-2deg) scale(1.03); }
.thumb img { display: block; width: 100%; height: 100%; object-fit: cover; }
.card h3 { margin: 6px 0 0; font-size: 1rem; font-weight: 800; line-height: 1.15; }
.card p { margin: 0; font-size: .82rem; color: var(--ink-soft); line-height: 1.3; flex: 1; }
.buy { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 6px; min-height: 36px; }
.price { font-family: var(--font-display); font-weight: 800; font-size: 1.2rem; color: var(--berry); font-variant-numeric: tabular-nums; }
.add { border: 0; background: var(--berry); color: #fff; border-radius: 999px; padding: 6px 14px; font-weight: 800; font-size: .88rem; }
.step { display: inline-flex; align-items: center; gap: 4px; background: var(--blush); border-radius: 999px; padding: 2px; }
.step button { width: 30px; height: 30px; border: 0; border-radius: 50%; background: var(--berry); color: #fff; font-weight: 800; font-size: 1.1rem; line-height: 1; }
.step output { min-width: 20px; text-align: center; font-weight: 800; font-variant-numeric: tabular-nums; }
.sheet-foot { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; padding: 12px 16px 14px 20px; background: #fff; border-top: 2px solid var(--blush); }
.total { font-weight: 800; }
.total span { color: var(--berry); font-family: var(--font-display); font-size: 1.3rem; font-variant-numeric: tabular-nums; }

@media (max-width: 760px) {
  .app { grid-template-columns: 1fr; grid-template-rows: auto minmax(0, 1fr); align-items: start; gap: 8px; }
  .hero { max-height: none; }
  .lead { display: none; }
  .facts { gap: 8px; }
  h1 { font-size: clamp(2.2rem, 11vw, 3rem); }
  .btn { padding: 11px 18px; }
}
@media (max-height: 560px) and (min-width: 761px) { .lead { display: none; } }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}
[hidden] { display: none !important; }
img { max-width: 100%; }
</style>
</head>

  for (var i = 0; i < 9; i++) {
    var s = document.createElementNS(NS, "svg");
    var size = 22 + (i * 7) % 26;
    s.setAttribute("viewBox", "0 0 120 140");
    s.setAttribute("width", size);
    s.setAttribute("height", Math.round(size * 1.17));
    s.style.left = (4 + i * 11) + "%";
    var dur = 11 + (i * 3) % 9;
    s.style.animationDuration = dur + "s";
    s.style.animationDelay = "-" + ((i * 5) % dur) + "s";
    var u = document.createElementNS(NS, "use");
    u.setAttribute("href", "#berry");
    s.appendChild(u);
    rain.appendChild(s);
  }

  function thumb(p) {
    return '<img src="' + p.img + '" alt="' + p.name + '" width="260" height="260" loading="lazy">';
  }

  function ctrl(p) {
    var n = qty[p.id] || 0;
    if (!n) return '<button class="add" type="button" data-act="add" data-id="' + p.id + '" aria-label="Agregar ' + p.name + '">Agregar</button>';
    return '<span class="step"><button type="button" data-act="sub" data-id="' + p.id + '" aria-label="Quitar uno de ' + p.name + '">−</button>' +
      "<output>" + n + '</output><button type="button" data-act="add" data-id="' + p.id + '" aria-label="Agregar uno más de ' + p.name + '">+</button></span>';
  }

  var grid = document.getElementById("grid");
  var tabs = document.getElementById("tabs");

  function renderTabs() {
    tabs.innerHTML = CATS.map(function (c) {
      return '<button class="tab" type="button" data-cat="' + c.id + '" aria-pressed="' + (c.id === cat) + '">' + c.label + "</button>";
    }).join("");
  }

  function renderGrid() {
    grid.innerHTML = PRODUCTS.filter(function (p) { return cat === "all" || p.cat === cat; }).map(function (p, i) {
      return '<article class="card" style="animation-delay:' + (i * 35) + 'ms">' +
        '<div class="thumb">' + thumb(p) + "</div>" +
        "<h3>" + p.name + "</h3><p>" + p.desc + "</p>" +
        '<div class="buy"><span class="price">Q' + p.price + '</span><span data-ctrl="' + p.id + '">' + ctrl(p) + "</span></div></article>";
    }).join("");
    grid.scrollTop = 0;
  }

  function summary() {
    var count = 0, total = 0, lines = [];
    PRODUCTS.forEach(function (p) {
      var n = qty[p.id] || 0;
      if (n) { count += n; total += n * p.price; lines.push(n + " x " + p.name); }
    });
    document.getElementById("total").innerHTML = "Tu pedido: " + count + (count === 1 ? " producto" : " productos") + " · <span>Q" + total + "</span>";
    var msg = count
      ? "Hola, quiero hacer este pedido:\n" + lines.join("\n") + "\nTotal: Q" + total
      : "Hola, quisiera hacer un pedido.";
    document.getElementById("wa-order").href = "https://wa.me/" + PHONE + "?text=" + encodeURIComponent(msg);
  }

  tabs.addEventListener("click", function (e) {
    var b = e.target.closest("[data-cat]");
    if (!b) return;
    cat = b.getAttribute("data-cat");
    renderTabs();
    renderGrid();
    var t = tabs.querySelector('[data-cat="' + cat + '"]');
    if (t) t.focus();
  });

  grid.addEventListener("click", function (e) {
    var b = e.target.closest("[data-act]");
    if (!b) return;
    var id = b.getAttribute("data-id");
    var p = PRODUCTS.filter(function (x) { return x.id === id; })[0];
    qty[id] = Math.max(0, (qty[id] || 0) + (b.getAttribute("data-act") === "add" ? 1 : -1));
    var slot = grid.querySelector('[data-ctrl="' + id + '"]');
    slot.innerHTML = ctrl(p);
    var again = slot.querySelector('[data-act="add"]');
    if (again) again.focus();
    summary();
  });

  var overlay = document.getElementById("overlay");
  function openMenu(from) {
    lastFocus = from || document.activeElement;
    overlay.hidden = false;
    renderTabs();
    renderGrid();
    summary();
    document.getElementById("close-menu").focus();
  }
  function closeMenu() {
    overlay.hidden = true;
    if (lastFocus && lastFocus.focus) lastFocus.focus();
  }
  document.getElementById("open-menu").addEventListener("click", function (e) { openMenu(e.currentTarget); });
  document.getElementById("mascot").addEventListener("click", function (e) { openMenu(e.currentTarget); });
  document.getElementById("close-menu").addEventListener("click", closeMenu);
  overlay.addEventListener("click", function (e) { if (e.target === overlay) closeMenu(); });
  document.addEventListener("keydown", function (e) {
    if (overlay.hidden) return;
    if (e.key === "Escape") { closeMenu(); return; }
    if (e.key === "Tab") {
      var f = overlay.querySelectorAll("button, a[href]");
      var first = f[0], last = f[f.length - 1];
      if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
      else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
    }
  });
})();
</script>

</body>
</html>
